<body>
<header class="top">
 <div class="brand"><div class="mark">H</div> HIPOTEZ</div>
 <div class="topright">
  <span class="pill">МАТЕМАТИКА • 5–11 КЛАССЫ</span>
  <button class="btn ghost small" id="langBtn">AZ</button>
  <button class="btn secondary small" id="topLogin">Войти</button>
 </div>
</header>

<main class="wrap" id="app"></main>
<footer>HIPOTEZ · Учись понимать математику, а не просто запоминать ответы</footer>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const $=s=>document.querySelector(s);
let lang='ru',role='student',currentUser=null,view='home',selectedTopic=0,selectedLevel=1,quizIndex=0,quizAnswers=[],students=[
 {name:'Али Мамедов',login:'ali.m',className:'9',completed:2,total:4,score:85},
 {name:'Лейла Алиева',login:'leyla.a',className:'9',completed:3,total:4,score:92},
 {name:'Эльвин Гусейнов',login:'elvin.g',className:'8',completed:1,total:4,score:60}
];

const topics=[
 {title:'Натуральные числа',desc:'Числа, действия и свойства натурального ряда',icon:'№',questions:[
  [
   {q:'Какое число следует за 999?',a:['1000','998','9999','900'],c:0},
   {q:'Чему равно 24 + 16?',a:['38','40','42','36'],c:1},
   {q:'Какое число делится на 5?',a:['42','31','45','28'],c:2}
  ],
  [
   {q:'Найди значение: 8 × (12 − 7)',a:['35','40','45','56'],c:1},
   {q:'Какое число является простым?',a:['21','27','29','33'],c:2},
   {q:'Вычисли: 144 ÷ 12 + 8',a:['18','20','22','24'],c:1}
  ],
  [
   {q:'Сумма трёх последовательных натуральных чисел равна 72. Найди среднее число.',a:['22','23','24','25'],c:2},
   {q:'Какое наименьшее натуральное число при делении на 6 и 8 даёт остаток 1?',a:['17','25','49','73'],c:1},
   {q:'Если a и b — натуральные числа, а a×b=1, чему равно a+b?',a:['0','1','2','Нельзя определить'],c:2}
  ]
 ]},
 {title:'Обыкновенные и десятичные дроби',desc:'Сравнение, преобразование и действия с дробями',icon:'½',questions:[
  [
   {q:'Какая дробь равна 1/2?',a:['2/3','3/6','4/6','1/3'],c:1},
   {q:'Запиши 0,7 в виде дроби со знаменателем 10.',a:['7/10','7/100','70/10','1/7'],c:0}
  ],
  [
   {q:'Вычисли: 1/4 + 2/4',a:['1/2','3/4','2/8','3/8'],c:1},
   {q:'Чему равно 0,25 × 4?',a:['0,1','0,5','1','10'],c:2}
  ],
  [
   {q:'Вычисли: 3/5 ÷ 9/10',a:['2/3','3/2','1/3','5/6'],c:0},
   {q:'Найди число, если 3/8 его равны 24.',a:['48','56','64','72'],c:2}
  ]
 ]},
 {title:'Отношение. Пропорция. Процент',desc:'Отношения величин, пропорции и процентные задачи',icon:'%',questions:[
  [
   {q:'Сколько составляет 10% от 80?',a:['4','8','10','16'],c:1},
   {q:'Отношение 6 к 3 равно…',a:['1:2','2:1','3:1','6:1'],c:1}
  ],
  [
   {q:'Найди x: 2/5 = x/20',a:['4','6','8','10'],c:2},
   {q:'Цена 50 манатов выросла на 20%. Новая цена?',a:['55','60','65','70'],c:1}
  ],
  [
   {q:'После скидки 15% товар стоит 170 манатов. Какова была первоначальная цена?',a:['185','195','200','210'],c:2},
   {q:'Число A на 25% больше B. На сколько процентов B меньше A?',a:['20%','25%','30%','33⅓%'],c:0}
  ]
 ]}
];

function t(s){return s}
function toast(msg){
 $('#toastRoot').innerHTML='<div class="toast">'+msg+'</div>';
 setTimeout(()=>$('#toastRoot').innerHTML='',2500)
}function showHome(){
 view='home';
 $('#app').innerHTML=`
 <section class="hero">
  <div>
   <h1>Математика становится понятнее с HIPOTEZ</h1>
   <p>Изучай темы, проходи тесты и отслеживай свой прогресс. Выбирай уровень сложности и двигайся вперёд.</p>
   <button class="btn" onclick="showTopics()">Начать обучение →</button>
  </div>
 </section>
 <section class="stats">
  <div class="stat"><strong>${topics.length}</strong><span class="muted">Учебные темы</span></div>
  <div class="stat"><strong>3</strong><span class="muted">Уровня сложности</span></div>
  <div class="stat"><strong>5–11</strong><span class="muted">Классы</span></div>
 </section>
 <div class="sectionhead"><h2>Популярные темы</h2><button class="btn secondary small" onclick="showTopics()">Все темы</button></div>
 <div class="grid">
 ${topics.map((x,i)=>`
 <article class="card topic">
  <div class="num">${x.icon}</div>
  <h3>${x.title}</h3>
  <p>${x.desc}</p>
  <div class="levels"><span class="level easy">Лёгкий</span><span class="level mid">Средний</span><span class="level hard">Сложный</span></div>
  <button class="btn small" style="margin-top:15px" onclick="openTopic(${i})">Открыть тему</button>
 </article>`).join('')}
 </div>`;
}

function showTopics(){
 view='topics';
 $('#app').innerHTML=`
 <div class="sectionhead"><h2>Все темы</h2><span class="muted">${topics.length} тем</span></div>
 <div class="grid">
 ${topics.map((x,i)=>`
 <article class="card topic">
  <div class="num">${x.icon}</div>
  <h3>${x.title}</h3>
  <p>${x.desc}</p>
  <button class="btn small" onclick="openTopic(${i})">Выбрать уровень</button>
 </article>`).join('')}
 </div>`;
}

function openTopic(i){
 selectedTopic=i;
 view='topic';
 const x=topics[i];
 $('#app').innerHTML=`
 <button class="btn ghost small" onclick="showTopics()">← Назад к темам</button>
 <div class="sectionhead"><h2>${x.title}</h2></div>
 <p class="muted">${x.desc}</p>
 <div class="grid">
 ${['Лёгкий','Средний','Сложный'].map((l,n)=>`
 <article class="card topic">
  <div class="num">${n+1}</div>
  <h3>${l} уровень</h3>
  <p>${x.questions[n].length} тренировочных вопросов</p>
  <button class="btn" onclick="startQuiz(${n})">Начать тест</button>
 </article>`).join('')}
 </div>`;
}

function startQuiz(level){
 selectedLevel=level;
 quizIndex=0;
 quizAnswers=[];
 view='quiz';
 renderQuestion();
}

function renderQuestion(){
 const questions=topics[selectedTopic].questions[selectedLevel];
 const q=questions[quizIndex];
 $('#app').innerHTML=`
 <button class="btn ghost small" onclick="openTopic(${selectedTopic})">← Назад</button>
 <div class="panel" style="margin-top:18px">
  <div class="row">
   <span class="muted">${topics[selectedTopic].title}</span>
   <span class="pill">Вопрос ${quizIndex+1} из ${questions.length}</span>
  </div>
  <div class="question">${q.q}</div>
  <div class="answers">
   ${q.a.map((a,i)=>`
   <button class="answer ${quizAnswers[quizIndex]===i?'selected':''}" onclick="selectAnswer(${i})">${a}</button>`).join('')}
  </div>
  <div class="row" style="margin-top:22px">
   <span class="muted">Уровень: ${['Лёгкий','Средний','Сложный'][selectedLevel]}</span>
   <button class="btn" onclick="nextQuestion()" ${quizAnswers[quizIndex]===undefined?'disabled':''}>
    ${quizIndex===questions.length-1?'Завершить':'Следующий вопрос →'}
   </button>
  </div>
 </div>`;
}

function selectAnswer(i){
 quizAnswers[quizIndex]=i;
 renderQuestion();
}

function nextQuestion(){
 const questions=topics[selectedTopic].questions[selectedLevel];
 if(quizAnswers[quizIndex]===undefined)return;
 if(quizIndex<questions.length-1){
  quizIndex++;
  renderQuestion();
 }else{
  finishQuiz();
 }
}

function finishQuiz(){
 const questions=topics[selectedTopic].questions[selectedLevel];
 let correct=0;
 questions.forEach((q,i)=>{
  if(q.c===quizAnswers[i])correct++;
 });
 const percent=Math.round(correct/questions.length*100);
 view='result';
 $('#app').innerHTML=`
 <div class="panel" style="text-align:center;padding:35px">
  <div class="num" style="margin:auto;width:60px;height:60px;font-size:25px">✓</div>
  <h2 style="margin-top:18px">Тест завершён!</h2>
  <div style="font-size:45px;font-weight:850;color:var(--green);margin:15px">${percent}%</div>
  <p class="muted">Правильных ответов: ${correct} из ${questions.length}</p>
  <div class="row" style="justify-content:center;margin-top:22px">
   <button class="btn" onclick="openTopic(${selectedTopic})">Вернуться к теме</button>
   <button class="btn secondary" onclick="showTopics()">Все темы</button>
  </div>
 </div>`;
}

function showLogin(){
 $('#modalRoot').innerHTML=`
 <div class="modalback" onclick="if(event.target===this)closeModal()">
  <div class="modal">
   <div class="loginbrand"><div class="mark">H</div><h1>Войти в HIPOTEZ</h1></div>
   <div class="tabs">
    <button class="active" id="studentTab" onclick="switchLogin('student')">Ученик</button>
    <button id="teacherTab" onclick="switchLogin('teacher')">Учитель</button>
   </div>
   <div class="field"><label>Логин</label><input id="loginName" placeholder="Введите логин"></div>
   <div class="field"><label>Пароль</label><input id="loginPass" type="password" placeholder="Введите пароль"></div>
   <button class="btn" style="width:100%" onclick="login()">Войти</button>
   <p class="muted" style="font-size:12px;margin-top:14px">Демо-вход учителя: teacher / demo123</p>
   <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Отмена</button>
  </div>
 </div>`;
 role='student';
}

function switchLogin(r){
 role=r;
 $('#studentTab').classList.toggle('active',r==='student');
 $('#teacherTab').classList.toggle('active',r==='teacher');
}

function closeModal(){
 $('#modalRoot').innerHTML='';
}

function login(){
 const name=$('#loginName').value.trim();
 const pass=$('#loginPass').value;
 if(role==='teacher'&&name==='teacher'&&pass==='demo123'){
  currentUser={name:'Учитель',role:'teacher'};
  closeModal();
  showTeacher();
  toast('Вы вошли как учитель');
 }else{
  toast('Неверный логин или пароль');
 }
}

function showTeacher(){
 view='teacher';
 $('#app').innerHTML=`
 <div class="sectionhead">
  <div><h2>Панель учителя</h2><p class="muted">Управление учениками и результатами</p></div>
  <button class="btn ghost small" onclick="logout()">Выйти</button>
 </div>
 <div class="layout">
  <aside class="side">
   <button class="navbtn active" onclick="showTeacher()">Ученики</button>
   <button class="navbtn" onclick="showTeacherTopics()">Темы и задания</button>
  </aside>
  <section class="mainpanel">
   <div class="panel">
    <div class="row">
     <h2>Ученики</h2>
     <button class="btn small" onclick="addStudent()">+ Добавить ученика</button>
    </div>
    <div class="tablewrap" style="margin-top:16px">
     <table>
      <thead><tr><th>Имя</th><th>Логин</th><th>Класс</th><th>Выполнено</th><th>Результат</th></tr></thead>
      <tbody>
       ${students.map(s=>`
       <tr>
        <td>${s.name}</td><td>${s.login}</td><td>${s.className}</td>
        <td>${s.completed}/${s.total}</td><td>${s.score}%</td>
       </tr>`).join('')}
      </tbody>
     </table>
    </div>
   </div>
  </section>
 </div>`;
}

function addStudent(){
 $('#modalRoot').innerHTML=`
 <div class="modalback">
  <div class="modal">
   <h2>Новый ученик</h2>
   <div class="field"><label>Имя ученика</label><input id="newName"></div>
   <div class="field"><label>Логин</label><input id="newLogin"></div>
   <div class="field"><label>Пароль</label><input id="newPassword" type="password"></div>
   <div class="field"><label>Класс</label><select id="newClass"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option></select></div>
   <button class="btn" style="width:100%" onclick="saveStudent()">Добавить</button>
   <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Отмена</button>
  </div>
 </div>`;
}

function saveStudent(){
 const name=$('#newName').value.trim();
 const login=$('#newLogin').value.trim();
 const password=$('#newPassword').value;
 const className=$('#newClass').value;
 if(!name||!login||!password){
  toast('Заполни все поля');
  return;
 }
 students.push({name,login,className,completed:0,total:0,score:0});
 closeModal();
 showTeacher();
 toast('Ученик добавлен');
}

function showTeacherTopics(){
 $('#app').innerHTML=`
 <div class="sectionhead">
  <h2>Темы и задания</h2>
  <button class="btn ghost small" onclick="showTeacher()">← Назад</button>
 </div>
 <div class="panel">
  <h3>Учебные темы</h3>
  ${topics.map((x,i)=>`
  <div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)">
   <span>${x.title}</span><span class="pill">${x.questions.flat().length} вопросов</span>
  </div>`).join('')}
  <div class="notice" style="margin-top:16px">
   Здесь отображаются демонстрационные темы. Создание и назначение заданий будет добавлено при подключении базы данных.
  </div>
 </div>`;
}

function logout(){
 currentUser=null;
 showHome();
 toast('Вы вышли из аккаунта');
}

$('#topLogin').addEventListener('click',showLogin);
$('#langBtn').addEventListener('click',()=>{
 lang=lang==='ru'?'az':'ru';
 $('#langBtn').textContent=lang==='ru'?'AZ':'RU';
 toast('Переключение языка пока демонстрационное');
});

showHome();
</script>
</body>
</html><!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIPOTEZ — математика</title>
<style>
:root{--green:#142B4A;--green2:#F28C28;--ink:#172438;--muted:#748196;--line:#E2E7EF;--bg:#F4F6FA;--white:#fff;--soft:#FFF0DF;--red:#d75b5b;--amber:#F28C28}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1160px)/2));position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:22px;letter-spacing:-.8px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}
.topright{display:flex;align-items:center;gap:12px}
.pill{background:var(--soft);color:#C8751C;padding:7px 12px;border-radius:30px;font-size:12px;font-weight:700}
.wrap{max-width:1160px;margin:0 auto;padding:34px 22px 70px}
.hero{background:linear-gradient(120deg,#10243E,#1D4269);border-radius:24px;color:white;padding:34px;display:flex;justify-content:space-between;gap:24px;align-items:center;overflow:hidden;position:relative}
.hero:after{content:"∑";font-size:190px;font-weight:800;color:#ffffff12;position:absolute;right:35px;top:-40px}
.hero h1{font-size:34px;line-height:1.12;margin:0 0 12px;max-width:600px;letter-spacing:-1px}
.hero p{color:#d7e5f5;margin:0;max-width:560px}
.hero .btn{background:#F28C28;color:#142B4A;position:relative;z-index:1}
.btn{background:var(--green);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;transition:.15s}
.btn:hover{filter:brightness(.95);transform:translateY(-1px)}
.btn.secondary{background:var(--soft);color:#D87516}
.btn.secondary:hover{background:#FFE2C2}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff0f0;color:var(--red)}
.btn.small{padding:8px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
.stat,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:19px}
.stat strong{font-size:25px;display:block}
.muted{color:var(--muted)}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}
.sectionhead h2{margin:0;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.topic{padding:19px}
.topic .num{width:34px;height:34px;border-radius:11px;background:var(--soft);color:#E47D1D;display:grid;place-items:center;font-weight:800}
.topic h3{margin:13px 0 5px}
.topic p{margin:0 0 15px;color:var(--muted);font-size:13px}
.levels{display:flex;gap:7px;flex-wrap:wrap}
.level{font-size:11px;font-weight:750;padding:5px 8px;border-radius:20px}
.easy{background:#EAF0F8;color:#244B76}
.mid{background:#FFF0DF;color:#C8751C}
.hard{background:#FFE8E5;color:#c34f4f}
.layout{display:grid;grid-template-columns:230px 1fr;gap:20px;margin-top:22px}
.side{background:white;border:1px solid var(--line);border-radius:18px;padding:13px;height:max-content;position:sticky;top:90px}
.navbtn{display:flex;width:100%;padding:11px 12px;border-radius:11px;background:transparent;color:#53615a;text-align:left;font-weight:650;margin:3px 0;gap:10px;align-items:center}
.navbtn.active,.navbtn:hover{background:var(--soft);color:#D87516}
.mainpanel{min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.panel h2{margin:0 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13px;font-weight:700;color:#526159}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid #dce5df;border-radius:11px;background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:#F28C28;box-shadow:0 0 0 3px #F28C2818}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:540px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:700}
.status{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:750}
.done{background:#e9f7ef;color:#16845b}
.todo{background:#fff5df;color:#a87513}
.question{font-size:24px;font-weight:800;margin:22px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{border:1px solid var(--line);background:#fff;padding:14px;border-radius:12px;text-align:left;font-weight:650}
.answer.selected{border-color:#F28C28;background:var(--soft);color:#B96812}
.answer.correct{border-color:#16845b;background:#e9f7ef}
.answer.wrong{border-color:var(--red);background:#fff0f0}
.notice{background:#f2f7f4;border:1px solid #dcebe2;border-radius:13px;padding:13px;color:#486257;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#142B4A;color:white;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0002}
.modalback{position:fixed;inset:0;background:#0b2119a8;display:grid;place-items:center;padding:18px;z-index:10}
.modal{background:#fff;border-radius:20px;padding:24px;width:min(440px,100%);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 4px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px #15291e1c;border-radius:13px;padding:8px;width:220px;z-index:8}
.menu button{width:100%;background:transparent;text-align:left;padding:10px;border-radius:9px}
.menu button:hover{background:var(--soft)}
.loginbox{max-width:480px;margin:46px auto}
.loginbox .panel{padding:28px}
.loginbrand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.loginbrand h1{font-size:24px;margin:0}
.tabs{display:flex;background:#f1f5f2;padding:4px;border-radius:12px;margin:20px 0}
.tabs button{flex:1;padding:9px;border-radius:9px;background:transparent;font-weight:700;color:var(--muted)}
.tabs button.active{background:#fff;color:#142B4A;box-shadow:0 1px 4px #0001}
footer{text-align:center;color:var(--muted);font-size:12px;padding:26px}
@media(max-width:800px){
.grid{grid-template-columns:1fr 1fr}
.layout{grid-template-columns:1fr}
.side{position:static;display:flex;overflow:auto}
.navbtn{white-space:nowrap;width:auto}
.hero h1{font-size:28px}
.hero:after{right:-10px}
.stats{gap:8px}
.stat{padding:13px}
.stat strong{font-size:21px}
}
@media(max-width:540px){
.top{height:62px;padding:0 15px}
.wrap{padding:20px 14px 45px}
.hero{padding:24px 20px;display:block}
.hero .btn{margin-top:18px}
.grid,.stats,.formgrid{grid-template-columns:1fr}
.answers{grid-template-columns:1fr}
.panel{padding:17px}
.topright .pill{display:none}
}
</style>
</head><body>
<header class="top">
 <div class="brand"><div class="mark">H</div> HIPOTEZ</div>
 <div class="topright">
  <span class="pill">МАТЕМАТИКА • 5–11 КЛАССЫ</span>
  <button class="btn ghost small" id="langBtn">AZ</button>
  <button class="btn secondary small" id="topLogin">Войти</button>
 </div>
</header>

<main class="wrap" id="app"></main>
<footer>HIPOTEZ · Учись понимать математику, а не просто запоминать ответы</footer>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const $=s=>document.querySelector(s);
let lang='ru',role='student',currentUser=null,view='home',selectedTopic=0,selectedLevel=1,quizIndex=0,quizAnswers=[],students=[
 {name:'Али Мамедов',login:'ali.m',className:'9',completed:2,total:4,score:85},
 {name:'Лейла Алиева',login:'leyla.a',className:'9',completed:3,total:4,score:92},
 {name:'Эльвин Гусейнов',login:'elvin.g',className:'8',completed:1,total:4,score:60}
];

const topics=[
 {title:'Натуральные числа',desc:'Числа, действия и свойства натурального ряда',icon:'№',questions:[
  [
   {q:'Какое число следует за 999?',a:['1000','998','9999','900'],c:0},
   {q:'Чему равно 24 + 16?',a:['38','40','42','36'],c:1},
   {q:'Какое число делится на 5?',a:['42','31','45','28'],c:2}
  ],
  [
   {q:'Найди значение: 8 × (12 − 7)',a:['35','40','45','56'],c:1},
   {q:'Какое число является простым?',a:['21','27','29','33'],c:2},
   {q:'Вычисли: 144 ÷ 12 + 8',a:['18','20','22','24'],c:1}
  ],
  [
   {q:'Сумма трёх последовательных натуральных чисел равна 72. Найди среднее число.',a:['22','23','24','25'],c:2},
   {q:'Какое наименьшее натуральное число при делении на 6 и 8 даёт остаток 1?',a:['17','25','49','73'],c:1},
   {q:'Если a и b — натуральные числа, а a×b=1, чему равно a+b?',a:['0','1','2','Нельзя определить'],c:2}
  ]
 ]},
 {title:'Обыкновенные и десятичные дроби',desc:'Сравнение, преобразование и действия с дробями',icon:'½',questions:[
  [
   {q:'Какая дробь равна 1/2?',a:['2/3','3/6','4/6','1/3'],c:1},
   {q:'Запиши 0,7 в виде дроби со знаменателем 10.',a:['7/10','7/100','70/10','1/7'],c:0}
  ],
  [
   {q:'Вычисли: 1/4 + 2/4',a:['1/2','3/4','2/8','3/8'],c:1},
   {q:'Чему равно 0,25 × 4?',a:['0,1','0,5','1','10'],c:2}
  ],
  [
   {q:'Вычисли: 3/5 ÷ 9/10',a:['2/3','3/2','1/3','5/6'],c:0},
   {q:'Найди число, если 3/8 его равны 24.',a:['48','56','64','72'],c:2}
  ]
 ]},
 {title:'Отношение. Пропорция. Процент',desc:'Отношения величин, пропорции и процентные задачи',icon:'%',questions:[
  [
   {q:'Сколько составляет 10% от 80?',a:['4','8','10','16'],c:1},
   {q:'Отношение 6 к 3 равно…',a:['1:2','2:1','3:1','6:1'],c:1}
  ],
  [
   {q:'Найди x: 2/5 = x/20',a:['4','6','8','10'],c:2},
   {q:'Цена 50 манатов выросла на 20%. Новая цена?',a:['55','60','65','70'],c:1}
  ],
  [
   {q:'После скидки 15% товар стоит 170 манатов. Какова была первоначальная цена?',a:['185','195','200','210'],c:2},
   {q:'Число A на 25% больше B. На сколько процентов B меньше A?',a:['20%','25%','30%','33⅓%'],c:0}
  ]
 ]}
];

function t(s){return s}
function toast(msg){
 $('#toastRoot').innerHTML='<div class="toast">'+msg+'</div>';
 setTimeout(()=>$('#toastRoot').innerHTML='',2500)
}function showHome(){
 view='home';
 $('#app').innerHTML=`
 <section class="hero">
  <div>
   <h1>Математика становится понятнее с HIPOTEZ</h1>
   <p>Изучай темы, проходи тесты и отслеживай свой прогресс. Выбирай уровень сложности и двигайся вперёд.</p>
   <button class="btn" onclick="showTopics()">Начать обучение →</button>
  </div>
 </section>
 <section class="stats">
  <div class="stat"><strong>${topics.length}</strong><span class="muted">Учебные темы</span></div>
  <div class="stat"><strong>3</strong><span class="muted">Уровня сложности</span></div>
  <div class="stat"><strong>5–11</strong><span class="muted">Классы</span></div>
 </section>
 <div class="sectionhead"><h2>Популярные темы</h2><button class="btn secondary small" onclick="showTopics()">Все темы</button></div>
 <div class="grid">
 ${topics.map((x,i)=>`
 <article class="card topic">
  <div class="num">${x.icon}</div>
  <h3>${x.title}</h3>
  <p>${x.desc}</p>
  <div class="levels"><span class="level easy">Лёгкий</span><span class="level mid">Средний</span><span class="level hard">Сложный</span></div>
  <button class="btn small" style="margin-top:15px" onclick="openTopic(${i})">Открыть тему</button>
 </article>`).join('')}
 </div>`;
}

function showTopics(){
 view='topics';
 $('#app').innerHTML=`
 <div class="sectionhead"><h2>Все темы</h2><span class="muted">${topics.length} тем</span></div>
 <div class="grid">
 ${topics.map((x,i)=>`
 <article class="card topic">
  <div class="num">${x.icon}</div>
  <h3>${x.title}</h3>
  <p>${x.desc}</p>
  <button class="btn small" onclick="openTopic(${i})">Выбрать уровень</button>
 </article>`).join('')}
 </div>`;
}

function openTopic(i){
 selectedTopic=i;
 view='topic';
 const x=topics[i];
 $('#app').innerHTML=`
 <button class="btn ghost small" onclick="showTopics()">← Назад к темам</button>
 <div class="sectionhead"><h2>${x.title}</h2></div>
 <p class="muted">${x.desc}</p>
 <div class="grid">
 ${['Лёгкий','Средний','Сложный'].map((l,n)=>`
 <article class="card topic">
  <div class="num">${n+1}</div>
  <h3>${l} уровень</h3>
  <p>${x.questions[n].length} тренировочных вопросов</p>
  <button class="btn" onclick="startQuiz(${n})">Начать тест</button>
 </article>`).join('')}
 </div>`;
}

function startQuiz(level){
 selectedLevel=level;
 quizIndex=0;
 quizAnswers=[];
 view='quiz';
 renderQuestion();
}

function renderQuestion(){
 const questions=topics[selectedTopic].questions[selectedLevel];
 const q=questions[quizIndex];
 $('#app').innerHTML=`
 <button class="btn ghost small" onclick="openTopic(${selectedTopic})">← Назад</button>
 <div class="panel" style="margin-top:18px">
  <div class="row">
   <span class="muted">${topics[selectedTopic].title}</span>
   <span class="pill">Вопрос ${quizIndex+1} из ${questions.length}</span>
  </div>
  <div class="question">${q.q}</div>
  <div class="answers">
   ${q.a.map((a,i)=>`
   <button class="answer ${quizAnswers[quizIndex]===i?'selected':''}" onclick="selectAnswer(${i})">${a}</button>`).join('')}
  </div>
  <div class="row" style="margin-top:22px">
   <span class="muted">Уровень: ${['Лёгкий','Средний','Сложный'][selectedLevel]}</span>
   <button class="btn" onclick="nextQuestion()" ${quizAnswers[quizIndex]===undefined?'disabled':''}>
    ${quizIndex===questions.length-1?'Завершить':'Следующий вопрос →'}
   </button>
  </div>
 </div>`;
}

function selectAnswer(i){
 quizAnswers[quizIndex]=i;
 renderQuestion();
}

function nextQuestion(){
 const questions=topics[selectedTopic].questions[selectedLevel];
 if(quizAnswers[quizIndex]===undefined)return;
 if(quizIndex<questions.length-1){
  quizIndex++;
  renderQuestion();
 }else{
  finishQuiz();
 }
}

function finishQuiz(){
 const questions=topics[selectedTopic].questions[selectedLevel];
 let correct=0;
 questions.forEach((q,i)=>{
  if(q.c===quizAnswers[i])correct++;
 });
 const percent=Math.round(correct/questions.length*100);
 view='result';
 $('#app').innerHTML=`
 <div class="panel" style="text-align:center;padding:35px">
  <div class="num" style="margin:auto;width:60px;height:60px;font-size:25px">✓</div>
  <h2 style="margin-top:18px">Тест завершён!</h2>
  <div style="font-size:45px;font-weight:850;color:var(--green);margin:15px">${percent}%</div>
  <p class="muted">Правильных ответов: ${correct} из ${questions.length}</p>
  <div class="row" style="justify-content:center;margin-top:22px">
   <button class="btn" onclick="openTopic(${selectedTopic})">Вернуться к теме</button>
   <button class="btn secondary" onclick="showTopics()">Все темы</button>
  </div>
 </div>`;
}

function showLogin(){
 $('#modalRoot').innerHTML=`
 <div class="modalback" onclick="if(event.target===this)closeModal()">
  <div class="modal">
   <div class="loginbrand"><div class="mark">H</div><h1>Войти в HIPOTEZ</h1></div>
   <div class="tabs">
    <button class="active" id="studentTab" onclick="switchLogin('student')">Ученик</button>
    <button id="teacherTab" onclick="switchLogin('teacher')">Учитель</button>
   </div>
   <div class="field"><label>Логин</label><input id="loginName" placeholder="Введите логин"></div>
   <div class="field"><label>Пароль</label><input id="loginPass" type="password" placeholder="Введите пароль"></div>
   <button class="btn" style="width:100%" onclick="login()">Войти</button>
   <p class="muted" style="font-size:12px;margin-top:14px">Демо-вход учителя: teacher / demo123</p>
   <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Отмена</button>
  </div>
 </div>`;
 role='student';
}

function switchLogin(r){
 role=r;
 $('#studentTab').classList.toggle('active',r==='student');
 $('#teacherTab').classList.toggle('active',r==='teacher');
}

function closeModal(){
 $('#modalRoot').innerHTML='';
}

function login(){
 const name=$('#loginName').value.trim();
 const pass=$('#loginPass').value;
 if(role==='teacher'&&name==='teacher'&&pass==='demo123'){
  currentUser={name:'Учитель',role:'teacher'};
  closeModal();
  showTeacher();
  toast('Вы вошли как учитель');
 }else{
  toast('Неверный логин или пароль');
 }
}

function showTeacher(){
 view='teacher';
 $('#app').innerHTML=`
 <div class="sectionhead">
  <div><h2>Панель учителя</h2><p class="muted">Управление учениками и результатами</p></div>
  <button class="btn ghost small" onclick="logout()">Выйти</button>
 </div>
 <div class="layout">
  <aside class="side">
   <button class="navbtn active" onclick="showTeacher()">Ученики</button>
   <button class="navbtn" onclick="showTeacherTopics()">Темы и задания</button>
  </aside>
  <section class="mainpanel">
   <div class="panel">
    <div class="row">
     <h2>Ученики</h2>
     <button class="btn small" onclick="addStudent()">+ Добавить ученика</button>
    </div>
    <div class="tablewrap" style="margin-top:16px">
     <table>
      <thead><tr><th>Имя</th><th>Логин</th><th>Класс</th><th>Выполнено</th><th>Результат</th></tr></thead>
      <tbody>
       ${students.map(s=>`
       <tr>
        <td>${s.name}</td><td>${s.login}</td><td>${s.className}</td>
        <td>${s.completed}/${s.total}</td><td>${s.score}%</td>
       </tr>`).join('')}
      </tbody>
     </table>
    </div>
   </div>
  </section>
 </div>`;
}

function addStudent(){
 $('#modalRoot').innerHTML=`
 <div class="modalback">
  <div class="modal">
   <h2>Новый ученик</h2>
   <div class="field"><label>Имя ученика</label><input id="newName"></div>
   <div class="field"><label>Логин</label><input id="newLogin"></div>
   <div class="field"><label>Пароль</label><input id="newPassword" type="password"></div>
   <div class="field"><label>Класс</label><select id="newClass"><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option></select></div>
   <button class="btn" style="width:100%" onclick="saveStudent()">Добавить</button>
   <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Отмена</button>
  </div>
 </div>`;
}

function saveStudent(){
 const name=$('#newName').value.trim();
 const login=$('#newLogin').value.trim();
 const password=$('#newPassword').value;
 const className=$('#newClass').value;
 if(!name||!login||!password){
  toast('Заполни все поля');
  return;
 }
 students.push({name,login,className,completed:0,total:0,score:0});
 closeModal();
 showTeacher();
 toast('Ученик добавлен');
}

function showTeacherTopics(){
 $('#app').innerHTML=`
 <div class="sectionhead">
  <h2>Темы и задания</h2>
  <button class="btn ghost small" onclick="showTeacher()">← Назад</button>
 </div>
 <div class="panel">
  <h3>Учебные темы</h3>
  ${topics.map((x,i)=>`
  <div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)">
   <span>${x.title}</span><span class="pill">${x.questions.flat().length} вопросов</span>
  </div>`).join('')}
  <div class="notice" style="margin-top:16px">
   Здесь отображаются демонстрационные темы. Создание и назначение заданий будет добавлено при подключении базы данных.
  </div>
 </div>`;
}

function logout(){
 currentUser=null;
 showHome();
 toast('Вы вышли из аккаунта');
}

$('#topLogin').addEventListener('click',showLogin);
$('#langBtn').addEventListener('click',()=>{
 lang=lang==='ru'?'az':'ru';
 $('#langBtn').textContent=lang==='ru'?'AZ':'RU';
 toast('Переключение языка пока демонстрационное');
});

showHome();
</script>
</body>
  </html>
