<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEPOTEZ — математика</title>
<style>
:root{--green:#16845b;--green2:#20a875;--ink:#18231f;--muted:#74817b;--line:#e6ece8;--bg:#f5f8f6;--white:#fff;--soft:#eaf6f0;--red:#d75b5b;--amber:#c58b25}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1160px)/2));position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:22px;letter-spacing:-.8px}.mark{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}
.topright{display:flex;align-items:center;gap:12px}.pill{background:var(--soft);color:var(--green);padding:7px 12px;border-radius:30px;font-size:12px;font-weight:700}
.wrap{max-width:1160px;margin:0 auto;padding:34px 22px 70px}.hero{background:linear-gradient(120deg,#123f31,#16845b);border-radius:24px;color:white;padding:34px;display:flex;justify-content:space-between;gap:24px;align-items:center;overflow:hidden;position:relative}
.hero:after{content:"∑";font-size:190px;font-weight:800;color:#ffffff12;position:absolute;right:35px;top:-40px}.hero h1{font-size:34px;line-height:1.12;margin:0 0 12px;max-width:600px;letter-spacing:-1px}.hero p{color:#d7eee3;margin:0;max-width:560px}.hero .btn{background:white;color:#146345;position:relative;z-index:1}
.btn{background:var(--green);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;transition:.15s}.btn:hover{filter:brightness(.95);transform:translateY(-1px)}.btn.secondary{background:var(--soft);color:var(--green)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:8px 11px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:19px}.stat strong{font-size:25px;display:block}.muted{color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.sectionhead h2{margin:0;font-size:21px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.topic{padding:19px}.topic .num{width:34px;height:34px;border-radius:11px;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:800}.topic h3{margin:13px 0 5px}.topic p{margin:0 0 15px;color:var(--muted);font-size:13px}.levels{display:flex;gap:7px;flex-wrap:wrap}.level{font-size:11px;font-weight:750;padding:5px 8px;border-radius:20px}.easy{background:#e9f7ef;color:#16845b}.mid{background:#fff5df;color:#a87513}.hard{background:#ffeded;color:#c34f4f}
.layout{display:grid;grid-template-columns:230px 1fr;gap:20px;margin-top:22px}.side{background:white;border:1px solid var(--line);border-radius:18px;padding:13px;height:max-content;position:sticky;top:90px}.navbtn{display:flex;width:100%;padding:11px 12px;border-radius:11px;background:transparent;color:#53615a;text-align:left;font-weight:650;margin:3px 0;gap:10px;align-items:center}.navbtn.active,.navbtn:hover{background:var(--soft);color:var(--green)}.mainpanel{min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.panel h2{margin:0 0 6px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:#526159}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #dce5df;border-radius:11px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #16845b18}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:700}.status{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:750}.done{background:#e9f7ef;color:#16845b}.todo{background:#fff5df;color:#a87513}
.question{font-size:24px;font-weight:800;margin:22px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:1px solid var(--line);background:#fff;padding:14px;border-radius:12px;text-align:left;font-weight:650}.answer.selected{border-color:var(--green);background:var(--soft);color:var(--green)}.answer.correct{border-color:#16845b;background:#e9f7ef}.answer.wrong{border-color:var(--red);background:#fff0f0}
.notice{background:#f2f7f4;border:1px solid #dcebe2;border-radius:13px;padding:13px;color:#486257;font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18231f;color:white;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0002}
.modalback{position:fixed;inset:0;background:#0b2119a8;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;border-radius:20px;padding:24px;width:min(440px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 4px}.menuwrap{position:relative}.menu{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px #15291e1c;border-radius:13px;padding:8px;width:220px;z-index:8}.menu button{width:100%;background:transparent;text-align:left;padding:10px;border-radius:9px}.menu button:hover{background:var(--soft)}
.loginbox{max-width:480px;margin:46px auto}.loginbox .panel{padding:28px}.loginbrand{display:flex;align-items:center;gap:10px;margin-bottom:22px}.loginbrand h1{font-size:24px;margin:0}.tabs{display:flex;background:#f1f5f2;padding:4px;border-radius:12px;margin:20px 0}.tabs button{flex:1;padding:9px;border-radius:9px;background:transparent;font-weight:700;color:var(--muted)}.tabs button.active{background:#fff;color:var(--green);box-shadow:0 1px 4px #0001}
footer{text-align:center;color:var(--muted);font-size:12px;padding:26px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.navbtn{white-space:nowrap;width:auto}.hero h1{font-size:28px}.hero:after{right:-10px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:21px}}
@media(max-width:540px){.top{height:62px;padding:0 15px}.wrap{padding:20px 14px 45px}.hero{padding:24px 20px;display:block}.hero .btn{margin-top:18px}.grid,.stats,.formgrid{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.panel{padding:17px}.topright .pill{display:none}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="mark">H</div> HEPOTEZ</div>
 <div class="topright"><span class="pill">МАТЕМАТИКА • 5–11 КЛАССЫ</span><button class="btn ghost small" id="langBtn">AZ</button><button class="btn secondary small" id="topLogin">Войти</button></div>
</header>
<main class="wrap" id="app"></main>
<footer>HEPOTEZ · Учись понимать математику, а не просто запоминать ответы</footer>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s);
let lang='ru',role='student',currentUser=null,view='home',selectedTopic=0,selectedLevel=1,quizIndex=0,quizAnswers=[],students=[
 {name:'Али Мамедов',login:'ali.m',className:'9',completed:2,total:4,score:85},
 {name:'Лейла Алиева',login:'leyla.a',className:'9',completed:3,total:4,score:92},
 {name:'Эльвин Гусейнов',login:'elvin.g',className:'8',completed:1,total:4,score:60}
];
const topics=[
 {title:'Натуральные числа',desc:'Числа, действия и свойства натурального ряда',icon:'№',questions:[
  [{q:'Какое число следует за 999?',a:['1000','998','9999','900'],c:0},{q:'Чему равно 24 + 16?',a:['38','40','42','36'],c:1},{q:'Какое число делится на 5?',a:['42','31','45','28'],c:2}],
  [{q:'Найди значение: 8 × (12 − 7)',a:['35','40','45','56'],c:1},{q:'Какое число является простым?',a:['21','27','29','33'],c:2},{q:'Вычисли: 144 ÷ 12 + 8',a:['18','20','22','24'],c:1}],
  [{q:'Сумма трёх последовательных натуральных чисел равна 72. Найди среднее число.',a:['22','23','24','25'],c:2},{q:'Какое наименьшее натуральное число при делении на 6 и 8 даёт остаток 1?',a:['17','25','49','73'],c:1},{q:'Если a и b — натуральные числа, а a×b=1, чему равно a+b?',a:['0','1','2','Нельзя определить'],c:2}]
 ]},
 {title:'Обыкновенные и десятичные дроби',desc:'Сравнение, преобразование и действия с дробями',icon:'½',questions:[
  [{q:'Какая дробь равна 1/2?',a:['2/3','3/6','4/6','1/3'],c:1},{q:'Запиши 0,7 в виде дроби со знаменателем 10.',a:['7/10','7/100','70/10','1/7'],c:0}],
  [{q:'Вычисли: 1/4 + 2/4',a:['1/2','3/4','2/8','3/8'],c:1},{q:'Чему равно 0,25 × 4?',a:['0,1','0,5','1','10'],c:2}],
  [{q:'Вычисли: 3/5 ÷ 9/10',a:['2/3','3/2','1/3','5/6'],c:0},{q:'Найди число, если 3/8 его равны 24.',a:['48','56','64','72'],c:2}]
 ]},
 {title:'Отношение. Пропорция. Процент',desc:'Отношения величин, пропорции и процентные задачи',icon:'%',questions:[
  [{q:'Сколько составляет 10% от 80?',a:['4','8','10','16'],c:1},{q:'Отношение 6 к 3 равно…',a:['1:2','2:1','3:1','6:1'],c:1}],
  [{q:'Найди x: 2/5 = x/20',a:['4','6','8','10'],c:2},{q:'Цена 50 манатов выросла на 20%. Новая цена?',a:['55','60','65','70'],c:1}],
  [{q:'После скидки 15% товар стоит 170 манатов. Какова была первоначальная цена?',a:['185','195','200','210'],c:2},{q:'Число A на 25% больше B. На сколько процентов B меньше A?',a:['20%','25%','30%','33⅓%'],c:0}]
 ]}
];
function t(s){return s}
function toast(msg){$('#toastRoot').innerHTML='<div class="toast">'+msg+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',2300)}
function headerMenu(){return `<div class="menuwrap"><button class="btn ghost small" onclick="toggleMenu()">⋮</button><div class="menu hidden" id="userMenu"><button onclick="accountInfo()">Информация об аккаунте</button><button onclick="logout()">Выйти из аккаунта</button></div></div>`}
function renderHome(){view='home';$('#app').innerHTML=`
 <section class="hero"><div><h1>Математика становится понятнее</h1><p>Изучай темы по порядку, закрепляй знания на практике и отслеживай свой прогресс вместе с HEPOTEZ.</p><button class="btn" onclick="showLogin()">Начать обучение →</button></div></section>
 <div class="stats"><div class="stat"><span class="muted">Классы</span><strong>5–11</strong><small class="muted">Школьная программа</small></div><div class="stat"><span class="muted">Уровни</span><strong>3</strong><small class="muted">Лёгкий · Средний · Сложный</small></div><div class="stat"><span class="muted">Языки</span><strong>RU / AZ</strong><small class="muted">Два языка интерфейса</small></div></div>
 <div class="sectionhead"><h2>Первые темы программы</h2><span class="muted">Демонстрационный список</span></div>
 <div class="grid">${topics.map((x,i)=>`<article class="card topic"><div class="num">${i+1}</div><h3>${x.title}</h3><p>${x.desc}</p><div class="levels"><span class="level easy">1 · Лёгкий</span><span class="level mid">2 · Средний</span><span class="level hard">3 · Сложный</span></div></article>`).join('')}</div>
 <div class="sectionhead"><h2>Два личных кабинета</h2></div><div class="grid"><div class="card"><h3>🎓 Кабинет ученика</h3><p class="muted">Темы, теория, тесты, домашние задания, напоминания и результаты.</p><button class="btn secondary" onclick="showLogin('student')">Вход ученика</button></div><div class="card"><h3>📋 Кабинет учителя</h3><p class="muted">Создание аккаунтов, назначение заданий и контроль успеваемости.</p><button class="btn secondary" onclick="showLogin('teacher')">Вход учителя</button></div><div class="card"><h3>📈 Прогресс</h3><p class="muted">Проверка выполненных работ и работа над ошибками.</p><span class="pill">В разработке</span></div></div>`}
function showLogin(which='student'){role=which;$('#app').innerHTML=`<div class="loginbox"><div class="panel"><div class="loginbrand"><div class="mark">H</div><div><h1>Вход в HEPOTEZ</h1><span class="muted">Выбери тип аккаунта</span></div></div><div class="tabs"><button class="${role==='student'?'active':''}" onclick="showLogin('student')">Ученик</button><button class="${role==='teacher'?'active':''}" onclick="showLogin('teacher')">Учитель</button></div><form onsubmit="login(event)"><div class="field"><label>Логин</label><input id="loginName" required placeholder="Введите логин"></div><div class="field"><label>Пароль</label><input id="loginPass" type="password" required placeholder="Введите пароль"></div><button class="btn" style="width:100%;margin-top:8px">Войти →</button></form><p class="notice" style="margin-top:18px">Это демонстрационная версия. Для просмотра кабинета учителя нажми «Демо-вход учителя», для ученика — «Демо-вход ученика». Реальные аккаунты подключаются после настройки защищённого сервера.</p><div class="row" style="margin-top:14px"><button class="btn secondary small" onclick="demoLogin('teacher')">Демо-вход учителя</button><button class="btn secondary small" onclick="demoLogin('student')">Демо-вход ученика</button></div><button class="btn ghost" style="width:100%;margin-top:12px" onclick="renderHome()">← На главную</button></div></div>`}
function login(e){e.preventDefault();let u=$('#loginName').value.trim(),p=$('#loginPass').value;if(role==='teacher'&&u==='teacher'&&p==='demo123'){demoLogin('teacher')}else{toast('Для этой версии используй демо-вход');}}
function demoLogin(r){role=r;currentUser=r==='teacher'?{name:'Учитель HEPOTEZ',surname:'',login:'teacher',className:'',role:'Учитель'}:{name:'Али',surname:'Мамедов',login:'ali.m',className:'9',role:'Ученик'};renderDashboard()}
function renderDashboard(){view='dashboard';let isT=role==='teacher';$('#app').innerHTML=`<div class="row"><div><span class="muted">${isT?'КАБИНЕТ УЧИТЕЛЯ':'ЛИЧНЫЙ КАБИНЕТ УЧЕНИКА'}</span><h1 style="margin:4px 0 0">${isT?'Добро пожаловать!':'Привет, '+currentUser.name+'!'}</h1></div>${headerMenu()}</div>
 <div class="layout"><aside class="side"><button class="navbtn active" onclick="dashTab('overview',this)">⌂ Обзор</button><button class="navbtn" onclick="dashTab('topics',this)">▦ Темы математики</button>${isT?'<button class="navbtn" onclick="dashTab(\'students\',this)">♙ Ученики</button><button class="navbtn" onclick="dashTab(\'create\',this)">＋ Создать ученика</button>':'<button class="navbtn" onclick="dashTab(\'tests\',this)">✓ Мои тесты</button><button class="navbtn" onclick="dashTab(\'progress\',this)">↗ Мой прогресс</button>'}</aside><section class="mainpanel" id="dashContent"></section></div>`;dashTab('overview',document.querySelector('.navbtn'))}
function dashTab(tab,el){document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');let c=$('#dashContent');if(tab==='overview'){c.innerHTML=role==='teacher'?teacherOverview():studentOverview()}else if(tab==='topics'){c.innerHTML=topicsView()}else if(tab==='students'){c.innerHTML=studentsView()}else if(tab==='create'){c.innerHTML=createStudentView()}else if(tab==='tests'){c.innerHTML=testsView()}else if(tab==='progress'){c.innerHTML=progressView()}}
function teacherOverview(){return `<div class="stats"><div class="stat"><span class="muted">Учеников</span><strong>${students.length}</strong></div><div class="stat"><span class="muted">Всего тем</span><strong>${topics.length}</strong></div><div class="stat"><span class="muted">Средний балл</span><strong>79%</strong></div></div><div class="panel"><div class="row"><h2>Последняя активность</h2><button class="btn secondary small" onclick="dashTab('students')">Все ученики</button></div>${students.slice(0,3).map(s=>`<div class="row" style="padding:13px 0;border-bottom:1px solid var(--line)"><div><b>${s.name}</b><div class="muted" style="font-size:12px">${s.className} класс · ${s.login}</div></div><div><b>${s.score}%</b><div class="muted" style="font-size:12px">${s.completed}/${s.total} заданий</div></div></div>`).join('')}</div><div class="notice" style="margin-top:14px">Здесь учитель сможет отслеживать выполнение заданий, результаты тестов и темы, которые требуют повторения.</div>`}
function studentOverview(){return `<div class="stats"><div class="stat"><span class="muted">Мои темы</span><strong>3</strong></div><div class="stat"><span class="muted">Выполнено тестов</span><strong>2</strong></div><div class="stat"><span class="muted">Средний результат</span><strong>85%</strong></div></div><div class="panel"><div class="row"><h2>Напоминания</h2><span class="status todo">Есть задания</span></div><p>У тебя есть тест, который ещё не завершён.</p><button class="btn" onclick="dashTab('tests')">Начать тест →</button></div><div class="sectionhead"><h2>Продолжить обучение</h2></div>${topics.slice(0,2).map((x,i)=>`<div class="card row" style="margin-bottom:10px"><div><b>${i+1}. ${x.title}</b><div class="muted" style="font-size:12px">Три уровня сложности</div></div><button class="btn secondary small" onclick="openTopic(${i})">Открыть</button></div>`).join('')}`}
function topicsView(){return `<div class="panel"><h2>Темы математики</h2><p class="muted">Выбери тему и пройди уровни по порядку.</p><div class="grid">${topics.map((x,i)=>`<div class="card topic"><div class="num">${i+1}</div><h3>${x.title}</h3><p>${x.desc}</p><button class="btn secondary small" onclick="openTopic(${i})">Открыть тему</button></div>`).join('')}</div></div>`}
function openTopic(i){selectedTopic=i;let x=topics[i];$('#dashContent').innerHTML=`<div class="panel"><button class="btn ghost small" onclick="dashTab('topics')">← Все темы</button><h2 style="margin-top:16px">${i+1}. ${x.title}</h2><p class="muted">${x.desc}</p><div class="notice">Сначала изучи теорию и формулы, затем переходи к упражнениям. Список тем предварительный: его нужно сверить со всеми страницами твоего сборника.</div><div class="grid" style="margin-top:16px">${['Лёгкий','Средний','Сложный'].map((n,j)=>`<div class="card"><span class="level ${['easy','mid','hard'][j]}">Уровень ${j+1}</span><h3>${n}</h3><p class="muted">${x.questions[j].length} демонстрационных вопросов</p><button class="btn ${j===0?'':'secondary'} small" onclick="startQuiz(${i},${j})">Начать уровень</button></div>`).join('')}</div></div>`}
function testsView(){return `<div class="panel"><h2>Мои тесты</h2><p class="muted">Назначенные задания и тесты.</p>${topics.map((x,i)=>`<div class="row" style="padding:14px 0;border-bottom:1px solid var(--line)"><div><b>${x.title}</b><div class="muted" style="font-size:12px">Уровень 1 · ${x.questions[0].length} вопроса</div></div><button class="btn small" onclick="startQuiz(${i},0)">Начать тест</button></div>`).join('')}</div>`}
function progressView(){return `<div class="panel"><h2>Мой прогресс</h2><p class="muted">Демонстрационная статистика</p><div class="stats"><div class="stat"><strong>2/3</strong><span class="muted">Темы начаты</span></div><div class="stat"><strong>85%</strong><span class="muted">Средний балл</span></div><div class="stat"><strong>6</strong><span class="muted">Ответов верно</span></div></div><div class="notice">После подключения базы данных здесь будут сохраняться реальные результаты и история попыток.</div></div>`}
function studentsView(){return `<div class="panel"><div class="row"><div><h2>Ученики</h2><p class="muted">Список ученических аккаунтов</p></div><button class="btn small" onclick="dashTab('create')">＋ Создать аккаунт</button></div><div class="tablewrap"><table><thead><tr><th>Ученик</th><th>Класс</th><th>Выполнено</th><th>Результат</th><th>Статус</th></tr></thead><tbody>${students.map(s=>`<tr><td><b>${s.name}</b><br><span class="muted">${s.login}</span></td><td>${s.className}</td><td>${s.completed}/${s.total}</td><td>${s.score}%</td><td><span class="status ${s.completed===s.total?'done':'todo'}">${s.completed===s.total?'Всё выполнено':'Есть задания'}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function createStudentView(){return `<div class="panel" style="max-width:700px"><h2>Создать аккаунт ученика</h2><p class="muted">Учитель задаёт данные для входа.</p><form onsubmit="createStudent(event)"><div class="formgrid"><div class="field"><label>Имя</label><input id="newName" required></div><div class="field"><label>Фамилия</label><input id="newSurname" required></div><div class="field"><label>Класс</label><select id="newClass"><option>5</option><option>6</option><option>7</option><option>8</option><option selected>9</option><option>10</option><option>11</option></select></div><div class="field"><label>Логин</label><input id="newLogin" required></div><div class="field"><label>Пароль</label><input id="newPassword" required minlength="4"></div></div><div class="notice">Демо-версия не сохраняет пароли и не создаёт настоящие аккаунты. В реальном проекте пароли будут обрабатываться защищённой системой авторизации.</div><button class="btn" style="margin-top:16px">Создать ученика</button></form></div>`}
function createStudent(e){e.preventDefault();students.push({name:$('#newName').value+' '+$('#newSurname').value,login:$('#newLogin').value,className:$('#newClass').value,completed:0,total:4,score:0});toast('Ученик добавлен в демонстрационный список');dashTab('students')}
function startQuiz(i,j){selectedTopic=i;selectedLevel=j;quizIndex=0;quizAnswers=[];renderQuestion()}
function renderQuestion(){let qs=topics[selectedTopic].questions[selectedLevel],q=qs[quizIndex];$('#dashContent').innerHTML=`<div class="panel"><div class="row"><button class="btn ghost small" onclick="dashTab('topics')">← К темам</button><span class="pill">Уровень ${selectedLevel+1} · Вопрос ${quizIndex+1}/${qs.length}</span></div><div style="height:7px;background:#edf2ee;border-radius:10px;margin-top:18px"><div style="height:7px;width:${(quizIndex/qs.length)*100}%;background:var(--green);border-radius:10px"></div></div><h2 style="margin-top:22px">${topics[selectedTopic].title}</h2><div class="question">${q.q}</div><div class="answers">${q.a.map((a,k)=>`<button class="answer ${quizAnswers[quizIndex]===k?'selected':''}" onclick="chooseAnswer(${k})">${String.fromCharCode(65+k)}. ${a}</button>`).join('')}</div><div class="row" style="margin-top:22px"><span class="muted">Выбери один вариант ответа</span><button class="btn" onclick="nextQuestion()" ${quizAnswers[quizIndex]===undefined?'disabled':''}>${quizIndex===qs.length-1?'Завершить':'Далее →'}</button></div></div>`}
function chooseAnswer(k){quizAnswers[quizIndex]=k;renderQuestion()}
function nextQuestion(){let qs=topics[selectedTopic].questions[selectedLevel];if(quizAnswers[quizIndex]===undefined)return;if(quizIndex<qs.length-1){quizIndex++;renderQuestion()}else{let score=qs.filter((q,i)=>q.c===quizAnswers[i]).length;let pct=Math.round(score/qs.length*100);$('#dashContent').innerHTML=`<div class="panel" style="text-align:center;padding:38px 20px"><div class="mark" style="margin:0 auto 15px;width:54px;height:54px;font-size:26px">✓</div><h2>Тест завершён!</h2><div style="font-size:48px;font-weight:850;color:var(--green);margin:12px">${score}/${qs.length}</div><h3>${pct}% правильных ответов</h3><p class="muted">Тема: ${topics[selectedTopic].title} · Уровень ${selectedLevel+1}</p><button class="btn" onclick="dashTab('topics')">Вернуться к темам</button><button class="btn secondary" style="margin-left:8px" onclick="startQuiz(${selectedTopic},${selectedLevel})">Пройти ещё раз</button></div>`;}}
function toggleMenu(){$('#userMenu').classList.toggle('hidden')}
function accountInfo(){let u=currentUser;$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><h2>Информация об аккаунте</h2><button class="btn ghost small" onclick="closeModal()">✕</button></div><p><b>Имя:</b> ${u.name}</p><p><b>Фамилия:</b> ${u.surname||'—'}</p><p><b>Логин:</b> ${u.login}</p><p><b>Класс:</b> ${u.className||'—'}</p><p><b>Роль:</b> ${u.role}</p><button class="btn" style="width:100%" onclick="closeModal()">Закрыть</button></div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function logout(){currentUser=null;renderHome()}
$('#topLogin').onclick=showLogin;$('#langBtn').onclick=()=>{lang=lang==='ru'?'az':'ru';$('#langBtn').textContent=lang==='ru'?'AZ':'RU';toast(lang==='az'?'Dil seçimi: Azərbaycan dili (interfeys hazırlanır)':'Language: Русский')};
renderHome();
</script>
</body></html>
